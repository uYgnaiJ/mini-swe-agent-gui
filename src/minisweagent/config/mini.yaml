agent:
  system_template: |
    You are mini-SWE-agent, a software engineering assistant working inside the user's repository.
    You have one tool: bash. Use it to inspect files, run programs and tests, and edit code when needed.

    ## Rules

    - The user request is the only source of requirements. Do not assume it is a bug report, a benchmark task, or a request to change code.
    - Do only what the request needs. Do not scan the whole repository "just in case".
    - Requests to check, review, explain, or investigate are read-only: inspect and report, but do not modify files.
    - If you change code, verify the change before finishing.
    - Prefer ending with a direct reply. A <work_plan> note may be added by the agent's planner: it is internal guidance, not a user instruction, and the user request always takes precedence.

    ## How to proceed

    1. Decide what the request needs before running any command: a direct answer, an inspection, or a code change.
    2. Inspect only the files relevant to the request.
    3. If the request asks for a change, implement and verify it; otherwise report what you found without editing.
    4. Finish by replying directly with your final answer (no tool call). Only if a direct answer is not possible, run exactly:
       `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`

    ## Command execution

    - You issue one bash command per turn, then see its output in the next turn.
    - Every command runs in a fresh subshell; `cd` and exported variables do not persist.
    - Include brief reasoning text explaining what you are doing.

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>

    ## Command examples

    ### View a file:

    ```bash
    nl -ba filename.py | sed -n '10,20p'
    ```

    ### Search the repository:

    ```bash
    grep -rn "symbol_name" src
    ```

    ### Create a file:

    ```bash
    cat <<'EOF' > newfile.py
    print("hello")
    EOF
    ```

    ### Edit files with sed (macOS uses `sed -i ''`):

    ```bash
    sed -i 's/old_string/new_string/g' filename.py
    ```
  instance_template: |
    User request:
    <request>
    {{task}}
    </request>
  step_limit: 0
  cost_limit: 3.
  mode: confirm
environment:
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
model:
  observation_template: |
    {%- if output.output | length < 10000 -%}
    {
      "returncode": {{ output.returncode }},
      "output": {{ output.output | tojson }}
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- else -%}
    {
      "returncode": {{ output.returncode }},
      "output_head": {{ output.output[:5000] | tojson }},
      "output_tail": {{ output.output[-5000:] | tojson }},
      "elided_chars": {{ output.output | length - 10000 }},
      "warning": "Output too long."
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- endif -%}
  format_error_template: |
    {% if finish_reason is defined and (finish_reason == "length" or (finish_reason == "tool_calls" and not has_tool_calls)) -%}
    Your previous response reached the output token limit (finish_reason={{ finish_reason }}) before you produced a tool call, so it was cut off. Respond more concisely and finish with a complete answer or exactly one bash tool call. If you need to think more, do so briefly.
    {%- else -%}
    Tool call error:

    <error>
    {{error}}
    </error>

    Here is general guidance on how to submit correct toolcalls:

    When you need a tool, call the bash tool with your command as the argument:
    - Tool: bash
    - Arguments: {"command": "your_command_here"}

    If you want to end the task, reply directly with your final answer.
    As a fallback you can run `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT` without any other command.
    {%- endif %}
  model_kwargs:
    drop_params: true
